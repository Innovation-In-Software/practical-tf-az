# ---------------------------------------------------------------------------
# Summit Retail: Terraform delivery for the Orders dev environment.
#
# Pull request  -> fmt, validate, plan, and post the plan as a comment
# Merge to main -> apply
#
# Copy this to .github/workflows/terraform.yml in your repository.
# ---------------------------------------------------------------------------
name: Terraform

on:
  pull_request:
    paths:
      - 'environments/dev/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'environments/dev/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

# Least privilege. The job reads the repository and writes PR comments.
# It does not need write access to code.
permissions:
  contents: read
  pull-requests: write

# One Terraform run at a time against this state file. Without this, two
# merges in quick succession fight over the state lock.
concurrency:
  group: terraform-orders-dev
  cancel-in-progress: false

env:
  TF_VERSION: '1.15.0'
  WORKING_DIR: environments/dev
  VAR_FILE: dev.tfvars

  # The azurerm provider reads these directly. No `az login` required for
  # Terraform itself, though we run it anyway for the az CLI steps.
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Variables with no default and no entry in dev.tfvars. Terraform picks up
  # any TF_VAR_<name> environment variable.
  TF_VAR_allowed_ssh_source: ${{ secrets.TF_VAR_ALLOWED_SSH_SOURCE }}

jobs:
  # -------------------------------------------------------------------------
  # This job's name is what branch protection requires as a status check.
  # -------------------------------------------------------------------------
  terraform-plan:
    name: terraform-plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Fails the build on unformatted code. Cheap, and it ends every code
      # review argument about whitespace.
      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      # continue-on-error so a failed plan still gets posted to the PR, where
      # someone can read the error. The final step fails the job.
      - name: Plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -input=false \
            -var-file="${{ env.VAR_FILE }}" \
            -out=tfplan 2>&1 | tee plan.txt

      - name: Post the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = '${{ env.WORKING_DIR }}/plan.txt';

            let plan = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'No plan output was produced.';

            // GitHub comments cap at 65536 characters.
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(-LIMIT);
              plan = '...output truncated, see the workflow run for the full plan...\n\n' + plan;
            }

            const ok = process.env.PLAN_OUTCOME === 'success';
            const heading = ok
              ? 'Terraform plan for `environments/dev`'
              : 'Terraform plan FAILED for `environments/dev`';

            const body = [
              '### ' + heading,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              '_Workflow: `' + context.workflow + '` &middot; commit `' +
                context.sha.substring(0, 7) + '`_'
            ].join('\n');

            // Update our previous comment instead of adding a new one on
            // every push. A PR with nine plan comments is unreadable.
            const marker = 'Terraform plan';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "terraform plan failed. See the plan comment on the pull request."
          exit 1

  # -------------------------------------------------------------------------
  # Runs only on a push to main, which on a protected branch means a merged,
  # reviewed pull request whose plan check passed.
  # -------------------------------------------------------------------------
  terraform-apply:
    name: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize
        run: terraform init -input=false

      # The plan that was reviewed ran against a different commit and is not
      # available here, so apply re-plans. -auto-approve is safe only because
      # the change already passed review and a plan check.
      - name: Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="${{ env.VAR_FILE }}"

      - name: Show outputs
        run: terraform output
